project:
  pre-render:
    - ../../tools/us-spelling
    - ../../tools/make-contents.py
  type: book
  output-dir: _book

# DRAFT: delete this block at release. Quarto reads the banner only
# from website:, and a book project does not copy it over from book:.
website:
  announcement:
    icon: info-circle
    dismissable: true
    content: >-
      **Draft.** This book is under active development, and
      chapters may change. Please use 'Report an issue' to flag
      problems.
    type: warning
    position: below-navbar

book:
  title: 'Reproducible Research for the Health Sciences'
  subtitle: 'Compendia, containers, and computational verification in R'
  author: "rgtlab curriculum team"
  date: today
  date-format: 'YYYY-MM-DD'

  cover-image: images/cover.png
  favicon: images/favicon.png

  site-url: https://reproducibility.rgtlab.org
  repo-url: https://github.com/rgt47/reproducibility
  repo-branch: main
  repo-actions: [edit, issue]
  # Sidebar 'Download PDF' link; CI builds the PDF with the site.
  downloads: [pdf]

  search: true
  page-navigation: true
  bread-crumbs: true
  sidebar:
    style: docked
    collapse-level: 1

  chapters:
    - half-title.qmd
    - copyright.qmd
    - index.qmd
    - contents.qmd
    - preface.qmd
    - conventions.qmd
    - 00-intro.qmd

    - part: 'Foundations'
      chapters:
        - 01-reproducibility-crisis.qmd
        - 02-levels-of-reproducibility.qmd
        - version-control.qmd
        - 03-research-compendium.qmd

    - part: 'Capturing the Environment'
      chapters:
        - 04-dependencies.qmd
        - 05-containers.qmd
        - 06-backends-runtimes.qmd

    - part: 'Validation'
      chapters:
        - 07-literate-programming.qmd
        - pipelines.qmd
        - 08-testing-quality.qmd
        - 09-continuous-integration.qmd

    - part: 'Collaboration and Stewardship'
      chapters:
        - 10-archiving-sharing.qmd

    - references.qmd

  appendices:
    - shell-primer.qmd
    - setup-appendix.qmd
    - cheat-sheet-index.qmd
    - glossary.qmd
    - credits.qmd
    - colophon.qmd

format:
  html:
    theme:
      - cosmo
      - repro.scss
    code-link: true
    include-after-body: partials/a11y.html
    code-copy: hover
    code-overflow: wrap
    code-tools:
      source: repo
      toggle: false
    code-block-bg: true
    code-block-border-left: '#14746f'
    highlight-style: arrow
    fig-width: 7
    fig-height: 4.5
    fig-align: center
    tbl-cap-location: top
    toc: true
    toc-title: 'On this page'
    toc-depth: 3
    anchor-sections: true
    smooth-scroll: true

  pdf:
    documentclass: scrbook
    classoption: [11pt]
    toc: false
    highlight-style: arrow
    geometry:
      - paperwidth=6.5in
      - paperheight=9in
      - top=0.9in
      - bottom=0.9in
      - inner=0.9in
      - outer=0.7in
    include-in-header:
      text: |
        \usepackage{fontspec}
        \usepackage{graphicx}
        \setmonofont{DejaVu Sans Mono}[Scale=0.9]
        % DRAFT: delete this line, and the matching footer block,
        % at release.
        \usepackage{eso-pic}
        \usepackage{fvextra}
        \DefineVerbatimEnvironment{Highlighting}{Verbatim}{breaklines,breakanywhere,breaknonspaceingroup,commandchars=\\\{\}}
    template-partials:
      - partials/before-body.tex

# PDF only: each check's answer is moved to the end of its chapter,
# because a collapsed callout hides nothing on paper (Decision D23).
filters:
  - path: filters/pdf-answers.lua
    at: pre-ast
  - filters/pdf-code-breaks.lua
  - _filters/contents-html-only.lua

bibliography: references.bib
csl: https://www.zotero.org/styles/apa

execute:
  freeze: auto
  echo: true
  warning: false
  message: false

knitr:
  opts_chunk:
    comment: '#>'
    collapse: true
    fig.retina: 2
    dpi: 150
    out.width: '100%'
